<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda do dia a dia </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1 class="text-center mb-4">
            Minha Agenda
        </h1>

    <div class="container mt-4">

        <div class="row g-2">

            <div class="col-md-6">
                <input type="text" id="nome" class="form-control" placeholder="Digite uma tarefa">
            </div>

            <div class="col-md-3">
                <select id="prioridade" class="form-select">

                    <option>Alta</option>
                    <option>Media</option>
                    <option>Baixa</option>

                </select>
            </div>

            <div class="col-md-3">
                <button onclick="criar_card()" class="btn btn-dark w-100">
                    Adicionar
                </button>
            </div>

        </div>

        <div id="main" class="row mt-4"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
